name: Cross-repository E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    uses: ./.github/workflows/reusable-e2e.yml
    with:
      infra_repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      infra_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      core_repository: scholars-ai/scholar-core
      core_ref: ${{ vars.SCHOLAR_CORE_REF || 'main' }}
      agents_repository: scholars-ai/scholar-agents
      agents_ref: ${{ vars.SCHOLAR_AGENTS_REF || 'main' }}
      shared_repository: scholars-ai/scholar-shared
      shared_ref: ${{ vars.SCHOLAR_SHARED_REF || 'main' }}
