name: Cross-repository E2E

on:
  pull_request:
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: scholar-infra
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: scholars-ai/scholar-core
          ref: ${{ vars.SCHOLAR_CORE_REF || 'main' }}
          path: scholar-core
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: scholars-ai/scholar-agents
          ref: ${{ vars.SCHOLAR_AGENTS_REF || 'main' }}
          path: scholar-agents
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: scholars-ai/scholar-shared
          ref: ${{ vars.SCHOLAR_SHARED_REF || 'main' }}
          path: scholar-shared
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.25.x"
      - name: Run real Postgres/pgmq pipeline with fake AI providers
        working-directory: scholar-infra
        run: ./e2e/run.sh
      - name: Dump service logs on failure
        if: failure()
        working-directory: scholar-infra
        run: docker compose -p scholars-e2e -f compose.local.yaml --profile e2e --profile services logs --no-color
