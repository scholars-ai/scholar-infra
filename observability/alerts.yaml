groups:
  - name: scholars-ai
    rules:
      - alert: PGMQOldestMessageTooOld
        expr: max by (queue) (scholar_pgmq_oldest_visible_age_seconds) > 300
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "PGMQ queue {{ $labels.queue }} oldest message exceeds 5 minutes"

      - alert: AgentDeadLetterAdded
        expr: sum(increase(scholar_agent_jobs_dead_lettered_total[5m])) > 0
        labels: { severity: critical }
        annotations:
          summary: "A Scholars AI job entered dead-letter storage"

      - alert: AgentFailureRateHigh
        expr: |
          sum(increase(scholar_agent_jobs_failed_total[10m]))
          /
          clamp_min(sum(increase(scholar_agent_jobs_started_total[10m])), 1) > 0.10
          and sum(increase(scholar_agent_jobs_started_total[10m])) >= 10
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Agent job failure rate exceeds 10% with at least 10 samples"

      - alert: TopicJudgeP95Slow
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(scholar_agent_job_duration_seconds_bucket{queue="topic_evaluate"}[10m]))) > 120
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "TopicJudge P95 exceeds 120 seconds"

      - alert: HarvesterTickSlow
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(scholar_core_harvester_tick_duration_seconds_bucket[10m]))) > 60
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Harvester P95 exceeds 60 seconds"

      - alert: CoreAPI5xx
        expr: sum(increase(scholar_core_api_errors_total{error_type="http_5xx"}[5m])) > 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Scholar Core API is returning 5xx responses"

      - alert: OTelCollectorExporterFailures
        expr: sum(rate(otelcol_exporter_send_failed_spans_total[5m])) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "OpenTelemetry Collector cannot export spans"

      - alert: ScholarsMetricsMissing
        expr: absent(scholar_core_scheduler_ticks_total) or absent(scholar_agent_jobs_started_total)
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Core or Agents metrics have not reached Prometheus"

      - alert: CoreDBPoolNearExhaustion
        expr: |
          scholar_core_db_pool_acquired
          /
          clamp_min(scholar_core_db_pool_max, 1) > 0.80
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Scholar Core database pool usage exceeds 80%"

      # Production baseline (2026-08-16): about 0.4 MiB of Prometheus WAL on a
      # host with 23 GiB free. Keep a conservative 4 GiB budget so a leak is
      # detected well before the host reaches its disk watermark.
      - alert: PrometheusStorageBudgetHigh
        expr: |
          prometheus_tsdb_storage_blocks_bytes
          + prometheus_tsdb_wal_storage_size_bytes > 4 * 1024 * 1024 * 1024
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Prometheus TSDB exceeds its 4 GiB production budget"

      - alert: PrometheusStorageGrowthFast
        expr: |
          predict_linear(prometheus_tsdb_storage_blocks_bytes[6h], 7 * 24 * 60 * 60)
            > 4 * 1024 * 1024 * 1024
          and
          deriv(prometheus_tsdb_storage_blocks_bytes[6h]) > 0
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "Prometheus storage growth projects above 4 GiB within 7 days"

      # Tempo's local backend does not export a filesystem-size gauge. Its
      # received-byte counter is the stable production signal available from
      # Tempo itself, so project a seven-day ingest budget from the last hour.
      - alert: TempoStorageGrowthFast
        expr: |
          sum(rate(tempo_ingester_bytes_received_total[1h]))
            * 7 * 24 * 60 * 60 > 4 * 1024 * 1024 * 1024
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Tempo ingest growth projects above 4 GiB within 7 days"
