# 生产环境（VPS）：postgres + core + agents + langfuse。
#   数据库自托管于本机（ADR-004）：业务库与 Langfuse 库同实例、不同 database。
#   密钥放 ./secrets/*.env（gitignore，只存在于 VPS 部署工作区）。
#   服务镜像来自 GHCR，由 deploy.sh 拉取指定版本。
name: scholars-prod

services:
  # 自托管 Postgres 17 + pgvector + pgmq（镜像见 ./postgres/Dockerfile，ADR-004）
  postgres:
    build: ./postgres
    image: scholars-postgres:17
    restart: unless-stopped
    env_file:
      - path: ./secrets/postgres.env
        required: true # POSTGRES_PASSWORD
    environment:
      POSTGRES_USER: scholar
      POSTGRES_DB: scholar
      # 业务库之外再建 langfuse 库（初始化脚本按需创建）
      LANGFUSE_DB: langfuse
    ports:
      # 仅本机监听。5433 已被 operation-content-platform 占用，本项目用 5434
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholar -d scholar"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  core:
    image: ghcr.io/scholars-ai/scholar-core:${CORE_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - path: ./secrets/core.env
        required: true # DATABASE_URL 等
    ports:
      - "127.0.0.1:8080:8080" # 仅本机监听，由已有 nginx 反代
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  agents-source-fetch: &agents
    image: ghcr.io/scholars-ai/scholar-agents:${AGENTS_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - path: ./secrets/agents.env
        required: true # DATABASE_URL / OLLAMA_HOST / ANTHROPIC_API_KEY / DEEPSEEK_API_KEY / LANGFUSE_*
    # 访问宿主机的 Ollama（embedding，ADR-005）与 RSSHub（采集）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../scholar-shared/rubrics:/scholar-shared/rubrics:ro
      - ../scholar-shared/profiles:/scholar-shared/profiles:ro
    environment:
      WORKER_QUEUES: source_fetch
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  agents-topic-scout:
    <<: *agents
    environment:
      WORKER_QUEUES: topic_scout

  agents-topic-evaluate:
    <<: *agents
    environment:
      WORKER_QUEUES: topic_evaluate

  agents-article-write:
    <<: *agents
    environment:
      WORKER_QUEUES: article_write

  # Langfuse 自托管，与业务库共用 postgres 实例的独立 database（ADR-004）
  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    env_file:
      - path: ./secrets/langfuse.env
        required: true # DATABASE_URL(langfuse 库) / NEXTAUTH_SECRET / SALT / NEXTAUTH_URL
    ports:
      - "127.0.0.1:3301:3000"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.131.1
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *logging

  tempo:
    image: grafana/tempo:2.8.2
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *logging

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *logging

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    env_file:
      - path: ./secrets/grafana.env
        required: true
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3302:3000"
    depends_on:
      - prometheus
      - tempo
    deploy:
      resources:
        limits:
          memory: 384M
    logging: *logging

volumes:
  pgdata:
  tempo-data:
  prometheus-data:
  grafana-data:
